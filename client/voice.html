<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VED Live</title>
    <link rel="stylesheet" href="css/voice-mode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Voice Overlay -->
<div id="voiceOverlay" data-state="idle">
    
    <!-- Exit Button -->
    <button class="voice-exit-btn" id="voiceExitBtn" aria-label="Close">✕</button>
    
    <!-- Voice Studio Button -->
    <button class="voice-studio-btn" id="voiceStudioBtn">🎛️ Voice Studio</button>

    <!-- Brand -->
    <div class="voice-brand">
        <img src="logo.png" alt="VED" onerror="this.style.display='none'">
        <span class="voice-name">VED</span>
    </div>

    <!-- Living Orb -->
    <div class="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-core"></div>
        <div class="orb-particles">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Waveform -->
    <div class="voice-waveform" id="voiceWaveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Status -->
    <p class="voice-status" id="voiceStatus">Tap to start</p>

    <!-- Transcript -->
    <p class="voice-transcript" id="voiceTranscript"></p>

    <!-- 🛑 BIG STOP BUTTON (Dadu ki demand!) -->
    <button class="voice-stop-btn" id="voiceStopBtn" aria-label="Stop VED">
        <span class="stop-icon">⬛</span>
        <span class="stop-label">Stop</span>
    </button>

    <!-- Founder Stamp -->
    <div class="ved-stamp">VED · by Sayali P. Pawar</div>

    <!-- Voice Studio Drawer -->
    <div class="voice-studio-drawer" id="voiceStudioDrawer">
        <div class="vs-header">
            <span>Choose VED's Voice</span>
            <button class="vs-close" id="vsClose">✕</button>
        </div>
        <div class="vs-grid" id="vsGrid"></div>
    </div>

</div>

<script src="js/voiceMode.js"></script>
</body>
</html>
