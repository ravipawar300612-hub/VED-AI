<!-- 🎬 CINEMATIC TRANSITION — Papa Ji Special -->
<script>
(function () {
    var input = document.getElementById('userInput');
    var send = document.getElementById('sendBtn');
    var box = document.getElementById('chatMessages');
    var on = false;
    function activate() {
        if (on) return;
        on = true;
        document.body.classList.add('chat-active');
    }
    if (box && box.children.length > 1) activate();
    if (input) {
        input.addEventListener('input', activate);
        input.addEventListener('keydown', activate);
    }
    if (send) send.addEventListener('click', activate);
})();
</script>

<!-- 🫧 PREMIUM GLASS BACK BUTTON + FORCE EXIT FIX -->
<style>
    #voiceExitBtn, #cameraExitBtn {
        position: fixed !important;
        top: 18px !important;
        left: 16px !important;
        width: auto !important;
        height: 44px !important;
        padding: 0 18px !important;
        background: rgba(15, 18, 24, 0.75) !important;
        backdrop-filter: blur(14px) !important;
        -webkit-backdrop-filter: blur(14px) !important;
        color: #eef2f6 !important;
        border: 1px solid rgba(255, 255, 255, 0.22) !important;
        border-radius: 999px !important;
        font-size: 15px !important;
        font-weight: 600 !important;
        letter-spacing: 0.02em !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        transform: none !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5) !important;
        z-index: 2147483647 !important;
        cursor: pointer !important;
    }
    #voiceExitBtn:active, #cameraExitBtn:active {
        transform: scale(0.94) !important;
        background: rgba(255, 255, 255, 0.15) !important;
    }
</style>

<script>
(function () {
    // FORCE EXIT — chahe camera ka JS roye ya chup rahe, button hamesha kaam karega
    function exitCamera() {
        var o = document.getElementById('cameraOverlay');
        if (o) { o.style.display = 'none'; o.setAttribute('data-stage', 'idle'); }
        try {
            var v = document.getElementById('cameraVideo');
            if (v && v.srcObject) { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); v.srcObject = null; }
        } catch (e) {}
        document.body.classList.remove('camera-active');
    }
    function exitVoice() {
        var o = document.getElementById('voiceOverlay');
        if (o) { o.style.display = 'none'; o.setAttribute('data-state', 'idle'); }
        document.body.classList.remove('voice-active');
    }
    document.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('#cameraExitBtn')) exitCamera();
        if (t.closest('#voiceExitBtn')) exitVoice();
        // Dobara kholne par inline display hat jaye
        if (t.closest('#cameraBtn')) { var c = document.getElementById('cameraOverlay'); if (c) c.style.display = ''; }
        if (t.closest('#micBtn')) { var vo = document.getElementById('voiceOverlay'); if (vo) vo.style.display = ''; }
    }, true);
})();
</script>
<!-- 🎬 CINEMA FOCUS MODE — Wallpaper → Black (Papa Ji + Sayali Special) -->
<style>
    .app { position: relative; z-index: 2; }
    body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #000000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease;
        z-index: 1;
    }
    body.chat-active::after { opacity: 1; }
    body.chat-active {
        background-image: none !important;
        background-color: #000000 !important;
    }
    body.chat-active .main,
    body.chat-active .container { color: #ffffff; }
</style>

<script>
(function () {
    // New chat par wapas wallpaper landing
    var nc = document.getElementById('newChatBtn');
    var box = document.getElementById('chatMessages');
    if (nc) nc.addEventListener('click', function () {
        setTimeout(function () {
            if (box && box.children.length <= 1) {
                document.body.classList.remove('chat-active');
            }
        }, 300);
    });
})();
</script>
