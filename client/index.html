<!-- 🎬 CINEMATIC TRANSITION -->
<script>
(function () {
    var input = document.getElementById('userInput');
    var send = document.getElementById('sendBtn');
    var box = document.getElementById('chatMessages');
    var on = false;
    function activate() { if (on) return; on = true; document.body.classList.add('chat-active'); }
    if (box && box.children.length > 1) activate();
    if (input) { input.addEventListener('input', activate); input.addEventListener('keydown', activate); }
    if (send) send.addEventListener('click', activate);
})();
</script>

<!-- 🔙 GLASS BACK BUTTONS -->
<style>
    #voiceExitBtn, #cameraExitBtn {
        position: fixed !important; top: 18px !important; left: 16px !important; width: auto !important;
        height: 44px !important; padding: 0 18px !important; background: rgba(15,18,24,0.75) !important;
        backdrop-filter: blur(14px) !important; -webkit-backdrop-filter: blur(14px) !important; color: #eef2f6 !important;
        border: 1px solid rgba(255,255,255,0.22) !important; border-radius: 999px !important;
        font-size: 15px !important; font-weight: 600 !important; letter-spacing: 0.02em !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;
        transform: none !important; box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
        z-index: 2147483647 !important; cursor: pointer !important;
    }
    #voiceExitBtn:active, #cameraExitBtn:active { transform: scale(0.94) !important; background: rgba(255,255,255,0.15) !important; }
</style>
<script>
(function () {
    function unlockOverlays() {
        var v = document.getElementById('voiceOverlay');
        var c = document.getElementById('cameraOverlay');
        if (v) v.style.display = '';
        if (c) c.style.display = '';
    }
    function exitCamera() {
        var o = document.getElementById('cameraOverlay');
        if (o) { o.classList.remove('active'); o.setAttribute('data-stage', 'idle'); o.style.display = ''; }
        try { var v = document.getElementById('cameraVideo');
            if (v && v.srcObject) { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); v.srcObject = null; } } catch (e) {}
        document.body.classList.remove('camera-active');
    }
    function exitVoice() {
        var o = document.getElementById('voiceOverlay');
        if (o) { o.classList.remove('active'); o.setAttribute('data-state', 'idle'); o.style.display = ''; }
        document.body.classList.remove('voice-active');
        if (typeof VoiceMode !== 'undefined' && VoiceMode.close) { try { VoiceMode.close(); } catch (e) {} }
    }
    document.addEventListener('click', function (e) {
        var t = e.target; if (!t || !t.closest) return;
        if (t.closest('#cameraExitBtn')) { exitCamera(); return; }
        if (t.closest('#voiceExitBtn')) { exitVoice(); return; }
        if (t.closest('#micBtn') || t.closest('#cameraBtn')) { unlockOverlays(); }
    }, true);
})();
</script>

<!-- 🩻 VOICE X-RAY (Papa phone debug) -->
<script>
(function () {
    function toast(msg) {
        var t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:2147483647;max-width:90%;text-align:center;border:1px solid rgba(255,255,255,0.25);box-shadow:0 6px 20px rgba(0,0,0,0.6);';
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 6000);
    }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var mic = document.getElementById('micBtn');
    if (mic) mic.addEventListener('click', function () {
        toast('🔍 Voice support: ' + (SR ? 'YES ✅' : 'NO ❌'));
    }, true);
    if (window.SpeechEngine && SpeechEngine.startListening) {
        var orig = SpeechEngine.startListening.bind(SpeechEngine);
        SpeechEngine.startListening = function (opts) {
            var o2 = opts || {};
            var ue = o2.onError;
            o2.onError = function (err) {
                toast('❌ SR error: ' + ((err && err.error) ? err.error : String(err)));
                if (ue) ue(err);
            };
            return orig(o2);
        };
    }
})();
</script>

<!-- 📱 MOBILE SIDEBAR FORCE FIX + CHAT BOTTOM ANCHOR -->
<style>
    .chat-box { display: flex; flex-direction: column; }
    .chat-box > :first-child { margin-top: auto; }
    #mobileMenuBtn {
        position: fixed !important; top: 16px !important; left: 16px !important;
        z-index: 9999999 !important; width: 46px !important; height: 46px !important;
        border-radius: 12px !important; background: rgba(15,18,24,0.85) !important;
        backdrop-filter: blur(10px) !important; -webkit-backdrop-filter: blur(10px) !important;
        color: #ffffff !important; border: 1px solid rgba(255,255,255,0.2) !important;
        font-size: 20px !important; cursor: pointer !important;
    }
</style>
<script>
(function () {
    var btn = document.getElementById('mobileMenuBtn');
    var sb = document.querySelector('.sidebar');
    var bd = document.getElementById('mobileBackdrop');
    if (!btn || !sb) return;

    function openSb() {
        sb.style.position = 'fixed';
        sb.style.top = '0'; sb.style.left = '0'; sb.style.bottom = '0';
        sb.style.width = '280px'; sb.style.maxWidth = '85vw';
        sb.style.transform = 'translateX(0)';
        sb.style.display = 'block';
        sb.style.zIndex = '999999';
        sb.style.overflowY = 'auto';
        sb.style.background = '#10151c';
        sb.style.pointerEvents = 'auto';
        if (bd) {
            bd.style.display = 'block';
            bd.style.position = 'fixed';
            bd.style.top = '0'; bd.style.left = '0'; bd.style.right = '0'; bd.style.bottom = '0';
            bd.style.background = 'rgba(0,0,0,0.55)';
            bd.style.zIndex = '999998';
        }
    }
    function closeSb() {
        sb.style.display = ''; sb.style.transform = '';
        sb.style.position = ''; sb.style.zIndex = '';
        if (bd) { bd.style.display = ''; bd.style.position = ''; }
    }
    btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        if (sb.style.display === 'block') closeSb(); else openSb();
    }, true);
    if (bd) bd.addEventListener('click', function (e) {
        e.stopImmediatePropagation(); closeSb();
    }, true);
    document.getElementById('sidebarCollapseBtn') &&
        document.getElementById('sidebarCollapseBtn').addEventListener('click', function () { setTimeout(closeSb, 150); });
})();
</script>

<!-- ➕ NEW CHAT NUCLEAR v2 -->
<script>
(function () {
    var sb = document.querySelector('.sidebar');
    if (sb) {
        sb.style.pointerEvents = 'auto';
        sb.querySelectorAll('button, input').forEach(function (el) { el.style.pointerEvents = 'auto'; });
    }
    document.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('#newChatBtn')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            var box = document.getElementById('chatMessages');
            if (box) box.innerHTML = '<div class="bot-message"><b>Welcome to VED AI</b><br><br>Ask me anything.</div>';
            var inp = document.getElementById('userInput');
            if (inp) inp.value = '';
            document.body.classList.remove('chat-active');
            var bd = document.getElementById('mobileBackdrop');
            if (sb) { sb.style.display = ''; sb.style.transform = ''; sb.style.position = ''; sb.style.zIndex = ''; }
            if (bd) { bd.style.display = ''; bd.style.position = ''; }
            var toast = document.createElement('div');
            toast.textContent = '✅ Nayi chat shuru!';
            toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.95);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:2147483647;border:1px solid rgba(255,255,255,0.25);';
            document.body.appendChild(toast);
            setTimeout(function () { toast.remove(); }, 2500);
        }
    }, true);
})();
</script>
