<!-- 🎬 CINEMATIC TRANSITION -->
<script>
(function () {
    var input = document.getElementById('userInput');
    var send = document.getElementById('sendBtn');
    var box = document.getElementById('chatMessages');
    var on = false;
    function activate() { if (on) return; on = true; document.body.classList.add('chat-active'); }
    if (box && box.children.length > 1) activate();
    if (input) { input.addEventListener('input', activate); input.addEventListener('keydown', activate); }
    if (send) send.addEventListener('click', activate);
})();
</script>

<style>

        position: fixed !important; top: 18px !important; left: 16px !important; width: auto !important;
        height: 44px !important; padding: 0 18px !important; background: rgba(15,18,24,0.75) !important;

        font-size: 15px !important; font-weight: 600 !important; letter-spacing: 0.02em !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;
        transform: none !important; box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
        z-index: 2147483647 !important; cursor: pointer;
    }
    #voiceExitBtn:active, #cameraExitBtn:active { transform: scale(0.94) !important; background: rgba(255,255,255,0.15) !important; }
</style>
<script>
(function () {
    function unlockOverlays() {
        var v = document.getElementById('voiceOverlay');
        var c = document.getElementById('cameraOverlay');
        if (v) v.style.display = '';
        if (c) c.style.display = '';
    }
    function exitCamera() {
        var o = document.getElementById('cameraOverlay');
        if (o) { o.classList.remove('active'); o.setAttribute('data-stage', 'idle'); o.style.display = ''; }
        try { var v = document.getElementById('cameraVideo');
            if (v && v.srcObject) { v.srcObject.getTracks().forEach(function (t) { t.stop(); }); v.srcObject = null; } } catch (e) {}
        document.body.classList.remove('camera-active');
    }
    function exitVoice() {
        var o = document.getElementById('voiceOverlay');
        if (o) { o.classList.remove('active'); o.setAttribute('data-state', 'idle'); o.style.display = ''; }
        document.body.classList.remove('voice-active');
        if (typeof VoiceMode !== 'undefined' && VoiceMode.close) { try { VoiceMode.close(); } catch (e) {} }
    }
    document.addEventListener('click', function (e) {
        var t = e.target; if (!t || !t.closest) return;
        if (t.closest('#cameraExitBtn')) { exitCamera(); return; }
        if (t.closest('#voiceExitBtn')) { exitVoice(); return; }
        if (t.closest('#micBtn') || t.closest('#cameraBtn')) { unlockOverlays(); }
    }, true);
})();
</script>

<script>
(function () {
    var btn = document.getElementById('mobileMenuBtn');
    var sb = document.querySelector('.sidebar');
    var bd = document.getElementById('mobileBackdrop');
    if (!btn || !sb) return;

    function openSb() {
        sb.style.position = 'fixed';
        sb.style.top = '0'; sb.style.left = '0'; sb.style.bottom = '0';
        sb.style.width = '280px'; sb.style.maxWidth = '85vw';
        sb.style.transform = 'translateX(0)';
        sb.style.display = 'block';
        sb.style.zIndex = '999999';
        sb.style.overflowY = 'auto';
        sb.style.background = '#10151c';
        sb.style.pointerEvents = 'auto';
        if (bd) {
            bd.style.display = 'block';
            bd.style.position = 'fixed';
            bd.style.top = '0'; bd.style.left = '0'; bd.style.right = '0'; bd.style.bottom = '0';
            bd.style.background = 'rgba(0,0,0,0.55)';
            bd.style.zIndex = '999998';
        }
    }
    function closeSb() {
        sb.style.display = ''; sb.style.transform = '';
        sb.style.position = ''; sb.style.zIndex = '';
        if (bd) { bd.style.display = ''; bd.style.position = ''; }
    }
    btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        if (sb.style.display === 'block') closeSb(); else openSb();
    }, true);
    if (bd) bd.addEventListener('click', function (e) {
        e.stopImmediatePropagation(); closeSb();
    }, true);
    document.getElementById('sidebarCollapseBtn') &&
        document.getElementById('sidebarCollapseBtn').addEventListener('click', function () { setTimeout(closeSb, 150); });
})();
</script>

<!-- ➕ NEW CHAT FIRST-TAP FIX (pointerdown + guard) -->
<script>
(function () {
    var last = 0;
    function doNewChat() {
        var now = Date.now();
        if (now - last < 600) return;
        last = now;
        var box = document.getElementById('chatMessages');
        if (box) box.innerHTML = '<div class="bot-message"><b>Welcome to VED AI</b><br><br>Ask me anything.</div>';
        var inp = document.getElementById('userInput');
        if (inp) inp.value = '';
        document.body.classList.remove('chat-active');
        var sb = document.querySelector('.sidebar');
        var bd = document.getElementById('mobileBackdrop');
        if (sb) {
            sb.style.display = ''; sb.style.transform = '';
            sb.style.position = ''; sb.style.zIndex = '';
            sb.classList.remove('open');
        }
        if (bd) { bd.style.display = ''; bd.style.position = ''; bd.classList.remove('open', 'visible'); }
        document.body.classList.remove('menu-open', 'sidebar-open');
    }
    ['pointerdown', 'touchend', 'click'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
            var t = e.target;
            if (t && t.closest && t.closest('#newChatBtn')) doNewChat();
        }, true);
    });
})();
</script>

<script>
(function(){
  function boot(){
    var input=document.getElementById('userInput');
    if(!input){ setTimeout(boot,300); return; }

    document.querySelectorAll('.ved-actions').forEach(function(el){ el.remove(); });

    var pill=document.querySelector('.input-area');
    if(!pill) return;

    var wrap=document.createElement('div');
    wrap.className='ved-actions';
    wrap.id='vedActions';
    wrap.innerHTML=
      '<button class="ved-action" data-action="voice"><span class="ico">🎙️</span>Live Voice Talk</button>'+
      '<button class="ved-action" data-prompt="Ye message scam hai ya safe? \'Congratulations! You won 1,00,000 lottery. Send 5,000 processing fee now.\'"><span class="ico">🛡️</span>Scam Shield Demo</button>'+
      '<button class="ved-action" data-prompt="Photo explain karo"><span class="ico">📷</span>Photo Analysis</button>'+
      '<button class="ved-action" data-prompt="मराठीत बोला"><span class="ico">🗣️</span>मराठी Mode</button>';

    pill.parentNode.insertBefore(wrap,pill);

    function chatKhulaHai(){
      if(document.body.classList.contains('chat-active')) return true;
      var box=document.getElementById('chatMessages');
      return !!(box && box.children.length>1);
    }

    function sync(){
      var open=chatKhulaHai();
      var w=document.getElementById('vedActions');
      if(w) w.classList.toggle('hide',open);
    }

    sync();
    setInterval(sync,500);

    if(window.MutationObserver){
      var box=document.getElementById('chatMessages');
      if(box) new MutationObserver(sync).observe(box,{childList:true});
    }

    wrap.addEventListener('click',function(e){
      var btn=e.target.closest('.ved-action');
      if(!btn) return;
      if(btn.dataset.action==='voice'){
        wrap.classList.add('hide');
        if(window.VoiceMode && VoiceMode.open) VoiceMode.open();
        return;
      }
      var text=btn.dataset.prompt||btn.textContent.trim();
      input.value=text;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.focus();
      var sendBtn=document.getElementById('sendBtn');
      if(sendBtn) setTimeout(function(){ sendBtn.click(); sync(); },150);
    });
  }

  if(document.readyState!=='loading') boot();
  else document.addEventListener('DOMContentLoaded',boot);
})();
</script>

<script>
(function(){
  window.__vedStreamReady = 2;
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function scrollBottom(){ var b=document.getElementById('chatMessages'); if(b) b.scrollTop=b.scrollHeight; }
  function addMsg(cls, html){
    var b=document.getElementById('chatMessages');
    var d=document.createElement('div');
    d.className=cls; d.innerHTML=html;
    b.appendChild(d); scrollBottom();
    return d;
  }

  function mdRender(src){
    var blocks=[];
    var s=src.replace(/```([\s\S]*?)```/g, function(m, code){
      blocks.push(code.replace(/^\n+|\n+$/g,''));
      return '\u0000CODE'+(blocks.length-1)+'\u0000';
    });
    s=esc(s);
    s=s.replace(/`([^`\n]+)`/g, function(m,c){ return '<code class="ved-ic">'+c+'</code>'; });
    s=s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s=s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s=s.replace(/^###\s?(.+)$/gm, '<div class="ved-h3">$1</div>');
    s=s.replace(/^##\s?(.+)$/gm, '<div class="ved-h2">$1</div>');
    s=s.replace(/^#\s?(.+)$/gm, '<div class="ved-h1">$1</div>');
    s=s.replace(/(^|\n)((?:[-*]\s.+(?:\n|$))+)/g, function(m, pre, list){
      var items=list.trim().split('\n').map(function(l){ return '<li>'+l.replace(/^[-*]\s/,'')+'</li>'; }).join('');
      return pre+'<ul>'+items+'</ul>';
    });
    s=s.replace(/(^|\n)((?:\d+\.\s.+(?:\n|$))+)/g, function(m, pre, list){
      var items=list.trim().split('\n').map(function(l){ return '<li>'+l.replace(/^\d+\.\s/,'')+'</li>'; }).join('');
      return pre+'<ol>'+items+'</ol>';
    });
    s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\n{2,}/g, '</p><p>');
    s=s.replace(/\n/g, '<br>');
    s='<p>'+s+'</p>';
    s=s.replace(/<p><\/p>/g,'');
    s=s.replace(/\u0000CODE(\d+)\u0000/g, function(m,i){
      return '<pre class="ved-pre"><code>'+esc(blocks[+i])+'</code></pre>';
    });
    return s;
  }

  function addActions(bot){
    if(bot.querySelector('.ved-msg-actions')) return;
    var bar=document.createElement('div');
    bar.className='ved-msg-actions';
    bar.innerHTML='<button class="ved-act" data-act="copy" type="button">📋 Copy</button><button class="ved-act" data-act="regen" type="button">🔄 Regenerate</button>';
    bot.appendChild(bar);
  }

  async function streamChat(text, existingBot){
    document.body.classList.add('chat-active');
    var bot;
    if(existingBot){
      bot=existingBot;
      bot.innerHTML='<span class="ved-dots"><span></span><span></span><span></span></span>';
      bot.dataset.raw='';
    } else {
      addMsg('user-message', esc(text));
      bot=addMsg('bot-message','<span class="ved-dots"><span></span><span></span><span></span></span>');
    }
    bot.dataset.prompt=text;
    var inp=document.getElementById('userInput'); if(inp && !existingBot) inp.value='';
    var acc='';
    try{
      var res=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
      if(!res.ok || !res.body) throw new Error('bad response');
      var reader=res.body.getReader();
      var dec=new TextDecoder();
      var buf=''; var first=false;
      while(true){
        var r=await reader.read();
        if(r.done) break;
        buf+=dec.decode(r.value,{stream:true});
        var lines=buf.split('\n\n');
        buf=lines.pop();
        for(var i=0;i<lines.length;i++){
          var line=lines[i];
          if(line.indexOf('data:')!==0) continue;
          var obj; try{ obj=JSON.parse(line.slice(5)); }catch(e){ continue; }
          if(obj.t){
            if(!first){ bot.innerHTML=''; first=true; }
            acc+=obj.t;
            bot.textContent=acc;
            scrollBottom();
          } else if(obj.done){
            if(obj.error && !first){ bot.innerHTML=''; acc='Kuch gadbad ho gayi. Dobara prayas karein. 🙏'; bot.textContent=acc; }
            if(obj.sources && obj.sources.length){
              var s=document.createElement('span');
              s.className='ved-src';
              s.innerHTML='📎 '+obj.sources.map(function(x){ return '<a href="'+x.uri+'" target="_blank" rel="noopener">'+esc(x.title)+'</a>'; }).join(' • ');
              bot.appendChild(s);
            }
          }
        }
      }
      if(!first && !acc){ acc='Kuch gadbad ho gayi. Dobara prayas karein. 🙏'; bot.textContent=acc; }
    }catch(e){
      acc=acc||'Internet mein dikkat hai. Dobara prayas karein. 🙏';
      bot.textContent=acc;
    }
    if(acc){
      bot.innerHTML=mdRender(acc);
      bot.dataset.raw=acc;
    }
    addActions(bot);
    scrollBottom();
  }

  function pendingAttachment(){
    var a=document.getElementById('attachmentPreview');
    return !!(a && a.children.length);
  }

  document.addEventListener('click', function(e){
    var t=e.target;
    if(!t || !t.closest) return;
    var act=t.closest('.ved-act');
    if(act){
      var bubble=act.closest('.bot-message');
      if(!bubble) return;
      if(act.dataset.act==='copy'){
        var raw=bubble.dataset.raw||bubble.textContent;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(raw).then(function(){
            act.textContent='✅ Copied!';
            setTimeout(function(){ act.textContent='📋 Copy'; },1500);
          });
        }
        return;
      }
      if(act.dataset.act==='regen'){
        var prompt=bubble.dataset.prompt;
        if(prompt) streamChat(prompt, bubble);
        return;
      }
      return;
    }
    if(!t.closest('#sendBtn')) return;
    if(pendingAttachment()) return;
    var inp=document.getElementById('userInput');
    var text=inp ? inp.value.trim() : '';
    if(!text) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    streamChat(text);
  }, true);

  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    var t=e.target;
    if(!t || t.id!=='userInput') return;
    if(pendingAttachment()) return;
    var inp=document.getElementById('userInput');
    var text=inp ? inp.value.trim() : '';
    if(!text) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    streamChat(text);
  }, true);
})();
</script>

<script>
(function(){
  if (window.WakeWord || window.__vedWakeBooted) return;
  window.__vedWakeBooted = true;
  var API = window.SpeechRecognition || window.webkitSpeechRecognition;
  var KEY='vedWakeWord', rec=null, on=false, running=false, cool=0;
  var btn=document.getElementById('wakeWordToggleBtn');
  function ovOpen(){ var o=document.getElementById('voiceOverlay'); return !!(o&&o.classList.contains('active')); }
  var st=document.createElement('style');
  st.textContent='#wakeWordToggleBtn.wake-on{color:#4ade80 !important;border-color:rgba(74,222,128,.5) !important;box-shadow:0 0 10px rgba(74,222,128,.35);animation:wakePulse 1.6s infinite}@keyframes wakePulse{0%,100%{opacity:1}50%{opacity:.55}}';
  document.head.appendChild(st);
  function setBtn(){ if(btn){ btn.classList.toggle('wake-on',on); btn.title=on?'Hey VED: ON':'Hey VED: OFF'; } }
  function toast(m){ var t=document.createElement('div'); t.textContent=m; t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.95);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;z-index:2147483647;border:1px solid rgba(255,255,255,.25);'; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }
  function heard(t){ if(!on||ovOpen()||Date.now()<cool) return; t=String(t||'').toLowerCase();
    if(!(/(hey|hi|hello|oye|are)\s+(ved|red|wed)(\s+ai)?\b/.test(t)||/\bved\s+ai\b/.test(t))) return;
    cool=Date.now()+4000; stop(); toast('🎤 Hey VED suna!');
    setTimeout(function(){ if(window.VoiceMode&&VoiceMode.open) VoiceMode.open(); },150); }
  function start(){ if(!API||!on||running||ovOpen()) return; running=true;
    try{ rec=new API(); rec.lang='en-IN'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
      rec.onresult=function(e){ for(var i=e.resultIndex;i<e.results.length;i++) heard(e.results[i][0].transcript); };
      rec.onend=function(){ running=false; if(on&&!ovOpen()) setTimeout(start,400); };
      rec.onerror=function(e){ if(e.error==='not-allowed'){ on=false; localStorage.setItem(KEY,'0'); setBtn(); } running=false; };
      rec.start(); }catch(err){ running=false; } }
  function stop(){ if(rec){ try{ rec.onend=null; rec.abort(); }catch(e){} rec=null; } running=false; }
  function enable(){ on=true; localStorage.setItem(KEY,'1'); setBtn(); start(); }
  function disable(){ on=false; localStorage.setItem(KEY,'0'); setBtn(); stop(); }
  if(btn) btn.addEventListener('click',function(e){ e.stopPropagation(); if(on){disable();toast('Hey VED: OFF');} else {enable();toast('Hey VED: ON — bolo "Hey VED"!');} });
  setInterval(function(){ if(on&&!ovOpen()&&!running) start(); if(ovOpen()&&running) stop(); },1500);
  if(localStorage.getItem(KEY)==='1') setTimeout(enable,1500);
  setBtn();
  window.WakeWord={enable:enable,disable:disable,isEnabled:function(){return on;}};
})();
</script>

(function(){
  var ov=document.createElement('div'); ov.id='imgStudio';
  ov.innerHTML='<div class="panel"><h3>Image Studio</h3><div class="sub">Describe a scene — VED will paint it.</div><textarea id="imgPrompt" placeholder="e.g. A monsoon evening in Mumbai, cinematic lighting..."></textarea><div class="row"><button class="primary" id="imgGen" type="button">Generate</button><button id="imgClose" type="button">Close</button></div><div class="out" id="imgOut"></div></div>';
  document.body.appendChild(ov);
  var ta=ov.querySelector('#imgPrompt'), out=ov.querySelector('#imgOut');
  ov.querySelector('#imgClose').onclick=function(){ ov.classList.remove('open'); };
  ov.addEventListener('click',function(e){ if(e.target===ov) ov.classList.remove('open'); });
  ov.querySelector('#imgGen').onclick=function(){
    var p=(ta.value||'').trim(); if(!p){ ta.focus(); return; }
    out.innerHTML='<div class="spin"></div>';
    fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.success) throw new Error(d.error||'fail');
        var src = d.data ? ('data:'+(d.mime||'image/png')+';base64,'+d.data) : d.url;
        out.innerHTML='';
        var img=document.createElement('img'); img.src=src; img.alt=p; out.appendChild(img);
        var cap=document.createElement('div'); cap.style.cssText='margin-top:8px;font-size:12.5px;color:#9aa4b2'; cap.textContent='🎨 '+p; out.appendChild(cap);
        var box=document.getElementById('chatMessages');
        if(box){ document.body.classList.add('chat-active');
          var um=document.createElement('div'); um.className='user-message'; um.textContent='🎨 '+p; box.appendChild(um);
          var bm=document.createElement('div'); bm.className='bot-message'; var im2=document.createElement('img'); im2.src=src; im2.style.cssText='max-width:320px;width:100%;border-radius:14px'; bm.appendChild(im2); box.appendChild(bm); box.scrollTop=box.scrollHeight; }
      })
      .catch(function(){ out.innerHTML='<div class="sub">Image generate nahi hui. Dobara try karo.</div>'; });
  };
  function addChip(){
    var w=document.getElementById('vedActions');
    if(!w){ setTimeout(addChip,700); return; }
    if(w.querySelector('[data-imgchip]')) return;
    var b=document.createElement('button'); b.className='ved-action'; b.type='button'; b.setAttribute('data-imgchip','1');
    b.innerHTML='<span class="ico">🎨</span>Image Studio';
    b.addEventListener('click',function(){ ov.classList.add('open'); setTimeout(function(){ ta.focus(); },100); });
    w.appendChild(b);
  }
  addChip();
})();
</script>
</body>
</html>
