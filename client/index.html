<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA META TAGS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VED AI">
    <meta name="theme-color" content="#0b0f14">
    <link rel="manifest" href="/manifest.json">

    <title>VED AI</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS FILES -->
    <link rel="stylesheet" href="style.css?v=71">
    <link rel="stylesheet" href="css/voice-mode.css?v=71">
    <link rel="stylesheet" href="css/camera-mode.css?v=71">
    <link rel="stylesheet" href="css/sidebar.css?v=71">
    <link rel="stylesheet" href="css/loading.css?v=71">
    <link rel="stylesheet" href="css/mobile.css?v=71">
    <link rel="stylesheet" href="css/suraksha.css?v=71">
    <link rel="stylesheet" href="css/missions.css?v=71">

    <!-- 🚀 NEW MAHABALI STYLES (Mobile + Font) -->
    <style>
      * {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important;
        letter-spacing: 0.01em;
      }
      
      /* MAHABALI MOBILE INPUT */
      @media (max-width: 768px) {
        .input-area {
          padding: 12px 8px !important;
          gap: 8px !important;
          min-height: 70px !important;
        }
        
        #userInput {
          font-size: 18px !important;
          padding: 16px 28px !important;
          min-height: 56px !important;
          border-radius: 28px !important;
        }
        
        #sendBtn {
          min-height: 56px !important;
          min-width: 64px !important;
          font-size: 16px !important;
          font-weight: 600 !important;
          padding: 16px 18px !important;
          border-radius: 28px !important;
        }
        
        .icon-btn {
          min-width: 48px !important;
          min-height: 48px !important;
        }
        
        .icon-btn svg {
          width: 24px !important;
          height: 24px !important;
        }
      }

      /* FINAL SCREEN FIX: full height + wallpaper + no cut */
      html {
          background: #0b0f14;
          -webkit-text-size-adjust: 100%;
          text-size-adjust: 100%;
      }
      html, body {
          margin: 0 !important;
          padding: 0 !important;
          width: 100%;
          max-width: 100vw;
          height: 100%;
          height: 100dvh;
          overflow: hidden !important;
      }
      .app {
          width: 100%;
          max-width: 100vw;
          height: 100%;
          height: 100dvh;
          background: transparent !important;
          overflow: hidden;
      }
      .main {
          flex: 1;
          min-width: 0;
          height: 100%;
      }
      .container {
          width: 100%;
          height: 100%;
          min-height: 0;
      }
      .chat-box {
          flex: 1;
          min-height: 0;
          max-width: 100%;
          overflow-y: auto;
      }
      #userInput {
          min-width: 0;
      }
    </style>
</head>

<body>

<!-- ✨ PREMIUM LOADING SCREEN OVERLAY -->
<div id="loading-screen">
    <div id="particles"></div>
    <div class="center-content">
        <h1 id="logo"><span id="logo-text"></span></h1>
        <p id="founder">Created by<br><span>Sayali P. R. Pawar ❤️</span></p>
        <p id="status-text">Initializing...</p>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <p id="quote">Every intelligent system starts with a single thought.</p>
    </div>
</div>

<!-- 📱 MOBILE HAMBURGER BUTTON + BACKDROP -->
<button id="mobileMenuBtn" aria-label="Open menu">☰</button>
<div id="mobileBackdrop"></div>

<div class="app">

    <!-- ================= SIDEBAR ================= -->
    <div class="sidebar">
        <div class="sb-header">
            <img src="logo.png" class="logo" alt="VED Logo">
            <span class="sb-wordmark">VED AI</span>
            <button id="wakeWordToggleBtn" class="sb-collapse-btn" type="button" aria-label="Toggle Hey VED wake word" title="Hey VED — hands-free voice">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                    <path d="M19 11a7 7 0 0 1-14 0"/>
                </svg>
            </button>
            <a href="login.html" class="sb-collapse-btn" aria-label="Login" style="text-decoration:none;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <path d="M10 17l5-5-5-5"/>
                    <path d="M15 12H3"/>
                </svg>
            </a>
            <button id="sidebarCollapseBtn" class="sb-collapse-btn" type="button" aria-label="Collapse sidebar">
                &#10094;
            </button>
        </div>

        <div class="sb-newchat-wrap">
            <button id="newChatBtn" type="button" title="New chat">
                <span>+</span>
                <span class="sb-btn-label">New chat</span>
            </button>
        </div>

        <div class="sb-search-wrap">
            <span class="sb-search-icon">&#128269;</span>
            <input type="text" id="sidebarSearchInput" placeholder="Search conversations..." autocomplete="off">
        </div>

        <div id="sidebarGroups" class="sb-groups"></div>

        <div class="sb-footer">Sayali P. R. Pawar</div>
    </div>

    <!-- ================= MAIN ================= -->
    <div class="main">
        <div class="container">
            <h1>VED AI</h1>
            <p class="tagline">Your Intelligent AI Companion</p>
            <p class="subtitle">Founded by Sayali P. R. Pawar</p>

            <div id="chatMessages" class="chat-box">
                <div class="bot-message">
                    <b>Welcome to VED AI</b><br><br>
                    Ask me anything.
                </div>
            </div>

            <div id="attachmentPreview" class="attachment-preview"></div>

            <div class="input-area">
                <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt" hidden>
                <button id="attachBtn" class="icon-btn" type="button" aria-label="Attach files">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5 12.4 20a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-7.8 7.8a2 2 0 0 1-3-3l7.2-7.1"/>
                    </svg>
                </button>
                <button id="micBtn" class="icon-btn mic-btn" type="button" aria-label="Voice mode">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                        <path d="M19 11a7 7 0 0 1-14 0"/>
                        <line x1="12" y1="18" x2="12" y2="22"/>
                        <line x1="8" y1="22" x2="16" y2="22"/>
                    </svg>
                </button>
                <button id="cameraBtn" class="icon-btn" type="button" aria-label="Camera mode">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.4A2 2 0 0 1 9.8 3.6h4.4a2 2 0 0 1 1.7 1L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
                        <circle cx="12" cy="12.5" r="3.4"/>
                    </svg>
                </button>
                <input type="text" id="userInput" placeholder="Message VED AI..." autocomplete="off">
                <button id="sendBtn" type="button">Send</button>
            </div>
        </div>
    </div>
</div>

<!-- ================= VOICE MODE OVERLAY ================= -->
<div id="voiceOverlay" data-state="idle">
    <button id="voiceExitBtn" class="voice-exit-btn" type="button" aria-label="Exit voice mode">✕</button>
    <div class="voice-brand">
        <img src="logo.png" alt="VED AI logo">
        <div class="voice-name">VED</div>
    </div>
    <div class="orb-wrap">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-core"></div>
    </div>
    <div id="voiceWaveform" class="voice-waveform">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div id="voiceStatus" class="voice-status">Idle</div>
    <div id="voiceTranscript" class="voice-transcript"></div>
</div>

<!-- ================= CAMERA MODE OVERLAY ================= -->
<div id="cameraOverlay" data-stage="live">
    <button id="cameraExitBtn" class="camera-exit-btn" type="button" aria-label="Exit camera mode">✕</button>
    <div class="camera-frame">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <img id="cameraPreviewImg" alt="Captured photo">
    </div>
    <div class="camera-controls">
        <button id="cameraCaptureBtn" type="button" aria-label="Capture photo"></button>
    </div>
    <div class="camera-review-controls">
        <input type="text" id="cameraQuestionInput" placeholder="Ask VED about this photo..." autocomplete="off">
        <div style="display:flex; gap:12px;">
            <button id="cameraRetakeBtn" class="camera-btn" type="button">Retake</button>
            <button id="cameraAskBtn" class="camera-btn primary" type="button">Ask VED</button>
        </div>
    </div>
    <div id="cameraStatus" class="camera-status"></div>
</div>

<!-- Scripts -->
<script src="js/authGuard.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/speechEngine.js"></script>
<script src="js/voiceMode.js"></script>
<script src="js/wakeWord.js"></script>
<script src="js/cameraEngine.js"></script>
<script src="js/cameraMode.js"></script>
<script src="script_new.js"></script>
<script src="js/loading.js"></script>
<script src="js/mobileMenu.js"></script>
<script src="js/suraksha.js"></script>
<script src="js/healthMode.js"></script>
<script src="js/cropMode.js"></script>
<script src="js/missions.js?v=99"></script>

</body>
</html>
